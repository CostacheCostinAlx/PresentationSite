<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <defs>
    <!-- Gradientul personalizat (Pink -> Magenta) -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3385" />   <!-- Roz aprins -->
      <stop offset="100%" stop-color="#c10b5d" /> <!-- Magenta profund -->
    </linearGradient>
    
    <!-- Un efect subtil de strălucire (glow) pentru un look elegant pe dark mode -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Elementele grafice ale mingii -->
  <g stroke="url(#neonGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Conturul exterior (cercul principal) -->
    <circle cx="50" cy="50" r="44" />
    
    <!-- Liniile curbate specifice mingii de volei -->
    <path d="M 18,20 C 40,45 60,45 82,20" />
    <path d="M 18,80 C 40,55 60,55 82,80" />
    <path d="M 20,18 C 45,40 45,60 20,82" />
    <path d="M 80,18 C 55,40 55,60 80,82" />
  </g>
</svg>