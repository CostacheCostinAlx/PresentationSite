<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient liniar Mauve -> Sapphire -->
    <linearGradient id="cat-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" /> 
      <stop offset="100%" stop-color="#89b4fa" /> 
    </linearGradient>
  </defs>

  <!-- Fundal: Catppuccin Mocha Base cu colțuri rotunjite -->
  <rect width="500" height="500" rx="100" fill="#1e1e2e" />

  <!-- Forma 'C' exterioară (reprezentând litera inițială sau un nod de sistem) -->
  <path d="M 350 150 A 142 142 0 1 0 350 350" fill="none" stroke="url(#cat-gradient)" stroke-width="40" stroke-linecap="round" />

  <!-- Prompt interior: caracterul '>' (Verde / Green) -->
  <path d="M 190 220 L 220 250 L 190 280" fill="none" stroke="#a6e3a1" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Prompt interior: cursorul '_' (Roșu / Red) -->
  <line x1="240" y1="280" x2="290" y2="280" stroke="#f38ba8" stroke-width="28" stroke-linecap="round" />
</svg>